version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/resources/node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-runtime-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/resources"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-resource-dependencies:
        patterns:
          - "*"
